<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LingoStar</title>
<style>
:root{
  color-scheme:light dark;
  --bg:transparent;
  --surface:#fff;
  --surface-muted:#f7f7f8;
  --border:rgba(0,0,0,.12);
  --border-strong:rgba(0,0,0,.22);
  --text:#0d0d0d;
  --text-muted:rgba(13,13,13,.64);
  --text-soft:rgba(13,13,13,.46);
  --accent:#10a37f;
  --accent-hover:#0e8f70;
  --danger:#dc2626;
  --radius:12px;
  --radius-sm:10px;
  --radius-full:999px;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  --font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --surface:#171717;
    --surface-muted:#212121;
    --border:rgba(255,255,255,.12);
    --border-strong:rgba(255,255,255,.24);
    --text:#f5f5f5;
    --text-muted:rgba(245,245,245,.68);
    --text-soft:rgba(245,245,245,.46);
    --accent:#7dd3a8;
    --accent-hover:#a7f3d0;
    --danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.28);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
.shell{width:100%;padding:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:10px}
.layout{max-width:760px;margin:0 auto;display:grid;gap:10px}
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
}
.panel.compact{padding:12px}
.headline{font-size:16px;line-height:1.35;font-weight:650;margin:0;color:var(--text)}
.title{font-size:14px;font-weight:650;margin:0;color:var(--text)}
.body{margin:0;color:var(--text-muted)}
.caption{font-size:12px;color:var(--text-soft)}
.divider{height:1px;background:var(--border);margin:6px 0}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:24px;padding:2px 9px;border-radius:var(--radius-full);
  border:1px solid var(--border);color:var(--text-muted);background:var(--surface);
  font-size:12px;white-space:nowrap;
}
.button{
  min-height:36px;border:1px solid transparent;border-radius:var(--radius-full);
  padding:7px 14px;background:var(--accent);color:#fff;font-weight:650;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
}
.button:hover:not(:disabled){background:var(--accent-hover)}
.button.secondary{
  background:var(--surface-muted);color:var(--text);border-color:var(--border);
}
.button.secondary:hover:not(:disabled){background:var(--surface);border-color:var(--border-strong)}
.button.ghost{
  background:transparent;color:var(--text-muted);border-color:var(--border);
}
.button.warn{background:var(--danger);color:#fff}
.button.small{min-height:30px;padding:5px 10px;font-size:12px}
.button.full{width:100%}
.icon-button{
  width:34px;height:34px;border-radius:var(--radius-full);
  border:1px solid var(--border);background:var(--surface-muted);color:var(--text);
  display:grid;place-items:center;font-weight:650;
}
.toolbar{max-width:760px;margin:0 auto 10px;display:flex;justify-content:flex-end;gap:6px}
.toast{
  max-width:760px;margin:0 auto 10px;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);color:var(--text-muted);
}
.welcome-list{margin:0;padding-left:18px;color:var(--text-muted)}
.welcome-list li{margin:5px 0}
.session-rail{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);
  gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px;
}
.session-card{
  min-width:0;scroll-snap-align:start;border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;background:var(--surface);
  display:flex;flex-direction:column;gap:10px;
}
.session-card.active{border-color:var(--border-strong)}
.session-name{font-size:15px;font-weight:650}
.session-goal{color:var(--text-muted);min-height:22px}
.progress{
  height:6px;background:var(--surface-muted);border-radius:var(--radius-full);overflow:hidden;
}
.progress span{display:block;height:100%;background:var(--text-muted);border-radius:inherit}
.lesson-shell{max-width:760px;margin:0 auto;display:grid;gap:10px}
.lesson-header{display:grid;gap:8px}
.lesson-carousel{overflow:hidden}
.lesson-track{display:flex;transition:transform 160ms ease;will-change:transform}
.exercise-slide{flex:0 0 100%;min-width:0}
.exercise-card{min-height:430px;display:flex;flex-direction:column;gap:14px}
.exercise-body{display:grid;gap:12px;flex:1}
.choice-list{display:grid;gap:8px}
.choice,.token{
  min-height:38px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);border-radius:var(--radius-sm);padding:8px 10px;text-align:left;
}
.choice.selected{border-color:var(--border-strong);box-shadow:inset 0 0 0 1px var(--border-strong)}
.token-bank{display:flex;flex-wrap:wrap;gap:8px}
.token{display:inline-flex;align-items:center;width:auto}
.token.used{opacity:.45}
.answer-box{
  min-height:48px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);
  padding:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);
}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:650;color:var(--text-muted)}
.field textarea,.field input{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);padding:10px 12px;resize:vertical;
}
.field textarea:focus,.field input:focus{
  outline:none;border-color:var(--border-strong);
}
.passage{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px;background:var(--surface);
}
.passage p{margin:6px 0 0;color:var(--text-muted)}
.nav-row{border-top:1px solid var(--border);padding-top:12px;margin-top:auto}
.modal-backdrop{
  position:fixed;inset:0;display:grid;place-items:center;padding:18px;
  background:rgba(0,0,0,.28);z-index:20;
}
.modal{
  width:min(480px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 12px 36px rgba(0,0,0,.24);padding:16px;
}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.empty{min-height:220px;display:grid;place-items:center;text-align:center}
.animate-in{animation:fadeIn 140ms ease both}
@keyframes fadeIn{from{opacity:.001;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (max-width:520px){
  .shell{padding:8px}
  .panel{padding:14px}
  .session-rail{grid-auto-columns:minmax(78%,1fr)}
  .exercise-card{min-height:520px}
}
</style>
</head>
<body>
<div id="app" class="shell">
  <div class="layout">
    <section class="panel empty">
      <div class="stack">
        <h1 class="headline">LingoStar</h1>
        <p class="body">Loading LingoStar...</p>
      </div>
    </section>
  </div>
</div>

<script type="module">
const ICON_SRC = "__LINGOSTAR_ICON__";
const APP_ORIGIN = "__LINGOSTAR_APP_ORIGIN__";
const DEFAULT_VIEW = "__LINGOSTAR_DEFAULT_VIEW__";
const UI_COPY = typeof __LINGOSTAR_UI_COPY__ === "object" ? __LINGOSTAR_UI_COPY__ : { en: {}, ko: {} };
const APP_VERSION = "0.10.0";

const appEl = document.getElementById("app");
const hasHost = Boolean(window.openai) || window.parent !== window;
const DIRECT_GRADE_TYPES = new Set(["language_info", "listening", "reading", "writing"]);
let state = {
  version: APP_VERSION,
  sessions: [],
  activeSessionId: null,
  currentSection: null,
  recentFeedback: [],
  feedbackItems: [],
  dashboard: {},
  host: {},
  gui: { screen: "welcome", widgetVersion: APP_VERSION, uiCopy: UI_COPY.en || {} },
};
let viewMode = null;
let currentExerciseIndex = 0;
let tokenAnswer = [];
let typedAnswers = new Map();
let pendingDeleteSessionId = null;
let feedbackOpen = false;
let notice = null;
let toast = "";
let busy = false;
let requestSeq = 0;
let persistTimer = null;
let contextTimer = null;
const pendingRequests = new Map();

function normalizeLocale(locale){
  const primary = String(locale || "").toLowerCase().split("-")[0];
  return primary === "ko" ? "ko" : "en";
}
function uiLang(){
  return normalizeLocale(state?.host?.interfaceLanguage || state?.host?.locale || window.openai?.locale || navigator.language || "en");
}
function copy(){
  const lang = uiLang();
  return { ...(UI_COPY.en || {}), ...(UI_COPY[lang] || {}), ...(state?.gui?.uiCopy || {}) };
}
function t(key, fallback = ""){
  return copy()[key] || fallback || key;
}
function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}
function clamp(value,min,max,fallback=min){
  const number = Number(value);
  if (!Number.isFinite(number)) return fallback;
  return Math.max(min, Math.min(max, number));
}
function cssEscape(value){
  if (typeof CSS !== "undefined" && typeof CSS.escape === "function") {
    return CSS.escape(String(value));
  }
  return String(value).replace(/["\\]/g, "\\$&");
}
function clean(value){ return String(value ?? "").trim(); }
function skillLabel(skill){ return t(skill, skill.replaceAll("_"," ")); }
function getActiveSession(){
  return (state.sessions || []).find(s => s.id === state.activeSessionId) || (state.sessions || [])[0] || null;
}
function getSection(){ return state.currentSection || null; }
function getAllExercises(section = getSection()){ return section?.exercises || []; }
function getCurrentExercise(){
  const exercises = getAllExercises();
  if (!exercises.length) return null;
  if (currentExerciseIndex < 0) currentExerciseIndex = 0;
  if (currentExerciseIndex >= exercises.length) currentExerciseIndex = exercises.length - 1;
  return exercises[currentExerciseIndex];
}
function getResultForExercise(id){
  return (getSection()?.results || []).find(result => result.exerciseId === id);
}
function getExerciseIndexById(id){
  return getAllExercises().findIndex(exercise => exercise.id === id);
}
function completedCount(){
  const section = getSection();
  if (!section) return 0;
  return getAllExercises(section).filter(exercise => getResultForExercise(exercise.id)).length;
}
function normalizeAnswer(value){
  return clean(value).replace(/\s+/g,"").toLowerCase();
}
function isMobileLike(){
  return /iphone|ipad|ipod|android|mobile/i.test(navigator.userAgent || "") || Math.min(window.innerWidth || 999, window.innerHeight || 999) < 560;
}

function rpcRequest(method, params = {}) {
  const id = `lingostar-${++requestSeq}`;
  return new Promise((resolve, reject) => {
    pendingRequests.set(id, { resolve, reject });
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    setTimeout(() => {
      if (pendingRequests.has(id)) {
        pendingRequests.delete(id);
        reject(new Error(`Timed out waiting for ${method}`));
      }
    }, 30000);
  });
}
function rpcNotify(method, params = {}) {
  if (!hasHost) return;
  window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
}
function updateModelContextForHost(text, structuredContent = {}) {
  if (!hasHost) return Promise.resolve({});
  if (window.openai?.updateModelContext) {
    return window.openai.updateModelContext({ content: text, structuredContent }).catch(() => ({}));
  }
  return rpcRequest("ui/update-model-context", {
    content: [{ type: "text", text }],
    structuredContent,
  }).catch(() => ({}));
}
function sendFollowUpToHost(prompt, options = {}) {
  if (!hasHost) return false;
  const visiblePrompt = options.visiblePrompt || prompt;
  const contextText = options.modelContext || prompt;
  const contextPayload = options.structuredContent || {};
  toast = t("working","Working...");
  render();
  updateModelContextForHost(contextText, contextPayload).then(() => {
    if (window.openai?.sendFollowUpMessage) {
      return window.openai.sendFollowUpMessage({ prompt: visiblePrompt, scrollToBottom: true });
    }
    return rpcRequest("ui/message", {
      role: "user",
      content: [{ type: "text", text: visiblePrompt }],
    });
  }).catch(err => {
    toast = String(err?.message || err);
    render();
  });
  return true;
}
async function callTool(name, args = {}) {
  busy = true;
  render();
  let response = null;
  try {
    if (!hasHost) response = await runPreviewTool(name, args);
    else if (window.openai?.callTool) response = await window.openai.callTool(name, args);
    else response = await rpcRequest("tools/call", { name, arguments: args });
    updateFromResponse(response);
  } catch (err) {
    toast = String(err?.message || err);
  } finally {
    busy = false;
    render();
  }
  return response;
}

function applyWidgetStateSnapshot(snapshot = {}) {
  if (!snapshot || typeof snapshot !== "object") return false;
  if (typeof snapshot.viewMode === "string" && ["welcome","select","lesson"].includes(snapshot.viewMode)) viewMode = snapshot.viewMode;
  if (Number.isInteger(snapshot.currentExerciseIndex)) currentExerciseIndex = snapshot.currentExerciseIndex;
  if (Array.isArray(snapshot.tokenAnswer)) tokenAnswer = snapshot.tokenAnswer;
  if (Array.isArray(snapshot.typedAnswers)) typedAnswers = new Map(snapshot.typedAnswers);
  if (typeof snapshot.pendingDeleteSessionId === "string" || snapshot.pendingDeleteSessionId === null) pendingDeleteSessionId = snapshot.pendingDeleteSessionId;
  return true;
}
function persistWidgetStateSoon() {
  if (!hasHost || !window.openai?.setWidgetState) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    window.openai.setWidgetState({
      viewMode,
      currentExerciseIndex,
      tokenAnswer,
      typedAnswers: Array.from(typedAnswers.entries()),
      pendingDeleteSessionId,
    }).catch(() => {});
  }, 80);
}
function notifyIntrinsicHeightSoon() {
  if (!hasHost) return;
  setTimeout(() => {
    const height = Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight || 420);
    rpcNotify("ui/resize", { height });
  }, 60);
}
function requestDisplayModeIfUseful() {
  if (!hasHost || !window.openai?.requestDisplayMode) return;
  const targetMode = viewMode === "lesson" && getSection() ? "fullscreen" : "";
  if (!targetMode) return;
  window.openai.requestDisplayMode({ mode: targetMode }).catch(() => {});
}
function requestInlineDisplayMode(reason = "") {
  if (!hasHost || !window.openai?.requestDisplayMode) return;
  window.openai.requestDisplayMode({ mode: "inline" }).catch(() => {});
  updateModelContextForHost(`LingoStar display mode returned inline. Reason: ${reason}`, {
    lingostar: { command: "display_mode_inline", reason },
  });
}
function syncCurrentExerciseContextSoon() {
  if (!hasHost) return;
  clearTimeout(contextTimer);
  contextTimer = setTimeout(() => {
    const session = getActiveSession();
    const section = getSection();
    const exercise = getCurrentExercise();
    if (!session || !section || !exercise) return;
    const draft = typedAnswers.get(exercise.id) || "";
    updateModelContextForHost([
      "LingoStar current practice context.",
      `Learning track: ${session.id} (${session.targetLanguage || ""})`,
      `Practice set: ${section.id} - ${section.title || ""}`,
      `Exercise ${currentExerciseIndex + 1}/${getAllExercises(section).length}: ${exercise.id} (${exercise.type})`,
      `Prompt: ${exercise.prompt || ""}`,
      `Instructions: ${exercise.instructions || ""}`,
      draft ? `Current answer draft: ${draft}` : "Current answer draft: (empty)",
      "If the user asks a question, answer in ChatGPT while keeping this widget state. Do not replace the current practice set unless the user asks.",
    ].join("\n"), {
      lingostar: {
        command: "current_exercise_context",
        sessionId: session.id,
        sectionId: section.id,
        exerciseIndex: currentExerciseIndex,
        exercise,
        currentAnswerDraft: draft || null,
        result: getResultForExercise(exercise.id) || null,
      },
    });
  }, 120);
}

window.addEventListener("message", event => {
  const msg = event.data;
  if (!msg || typeof msg !== "object") return;
  if (msg.id && pendingRequests.has(msg.id)) {
    const { resolve, reject } = pendingRequests.get(msg.id);
    pendingRequests.delete(msg.id);
    if (msg.error) reject(msg.error);
    else resolve(msg.result);
    return;
  }
  if (msg.method === "ui/notifications/tool-result") {
    updateFromResponse(msg.params);
    render();
  }
});
window.addEventListener("openai:set_globals", event => {
  const globals = event.detail?.globals || {};
  const restored = applyWidgetStateSnapshot(globals.widgetState);
  const hydrated = hydrateFromOpenAiGlobals(globals);
  if (restored || hydrated) render();
}, { passive: true });

if (hasHost) {
  rpcNotify("ui/initialize", {
    appInfo: { name: "lingostar", version: APP_VERSION },
    appCapabilities: { tools: { listChanged: true } },
    protocolVersion: "2026-01-26",
  });
  rpcNotify("ui/notifications/initialized", {});
}

function hydrateFromOpenAiGlobals(globals = window.openai || {}) {
  applyWidgetStateSnapshot(globals?.widgetState);
  const toolOutput = globals?.toolOutput;
  const metadata = globals?.toolResponseMetadata;
  if (!toolOutput) return false;
  updateFromResponse({
    structuredContent: toolOutput,
    _meta: metadata?.mcp_tool_result?._meta || metadata?.call_tool_result?._meta || metadata,
  });
  return true;
}
function applyInitialView(initialView) {
  if (!initialView || initialView === "auto") {
    if (!viewMode) viewMode = state.currentSection ? "lesson" : (state.sessions?.length ? "select" : "welcome");
    return;
  }
  if (initialView === "lesson") {
    viewMode = state.currentSection ? "lesson" : (state.sessions?.length ? "select" : "welcome");
    return;
  }
  if (initialView === "select") {
    viewMode = state.sessions?.length ? "select" : "welcome";
    return;
  }
  if (initialView === "welcome") viewMode = "welcome";
}
function updateFromResponse(response) {
  const actual = response?.result || response;
  const sc = actual?.structuredContent || actual;
  toast = "";
  if (sc?.state) {
    const previousSectionId = state?.currentSection?.id;
    state = sc.state;
    const nextSectionId = state?.currentSection?.id;
    const sectionJustCompleted = Boolean(previousSectionId && !nextSectionId);
    if (nextSectionId && nextSectionId !== previousSectionId) {
      viewMode = "lesson";
      currentExerciseIndex = 0;
      tokenAnswer = [];
    }
    if (sectionJustCompleted) {
      viewMode = state.sessions?.length ? "select" : "welcome";
      currentExerciseIndex = 0;
      tokenAnswer = [];
      toast = t("sectionComplete");
      requestInlineDisplayMode("section-complete");
    } else if (!viewMode) {
      applyInitialView(sc.initialView || "auto");
    }
  }
  if (sc?.initialView) applyInitialView(sc.initialView);
  if (sc?.transcript) {
    const exercise = getCurrentExercise();
    if (exercise) typedAnswers.set(exercise.id, sc.transcript);
  }
  if (actual?.content?.[0]?.text && !toast) toast = String(actual.content[0].text).split("\n")[0];
}

function renderToolbar() {
  return `<div class="toolbar">
    ${busy ? `<span class="pill">${escapeHtml(t("working","Working..."))}</span>` : ""}
    <button class="icon-button" data-action="open-help" aria-label="${escapeHtml(t("help"))}" title="${escapeHtml(t("help"))}">?</button>
    <button class="icon-button" data-action="open-feedback" aria-label="${escapeHtml(t("feedback"))}" title="${escapeHtml(t("feedback"))}">!</button>
  </div>`;
}
function render() {
  applyInitialView(viewMode || DEFAULT_VIEW || "auto");
  let html = renderToolbar();
  if (toast) html += `<div class="toast">${escapeHtml(toast)}</div>`;
  if (viewMode === "lesson" && getSection()) html += renderLesson();
  else if (state.sessions?.length && viewMode !== "welcome") html += renderSessionSelect();
  else html += renderWelcome();
  if (notice) html += renderNoticeModal();
  if (feedbackOpen) html += renderFeedbackModal();
  appEl.innerHTML = html;
  for (const [key, value] of typedAnswers) {
    const el = appEl.querySelector(`[data-draft-key="${cssEscape(key)}"]`);
    if (el) el.value = value;
  }
  persistWidgetStateSoon();
  requestDisplayModeIfUseful();
  syncCurrentExerciseContextSoon();
  notifyIntrinsicHeightSoon();
}

function renderWelcome() {
  const c = copy();
  return `<div class="layout animate-in">
    <section class="panel stack">
      <h1 class="headline">${escapeHtml(c.welcomeTitle)}</h1>
      <p class="body">${escapeHtml(c.welcomeBody)}</p>
      <div class="divider"></div>
      <h2 class="title">${escapeHtml(c.welcomeStructureTitle)}</h2>
      <ul class="welcome-list">${(c.welcomeStructure || []).map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
      <h2 class="title">${escapeHtml(c.welcomeSettingsTitle)}</h2>
      <ul class="welcome-list">${(c.welcomeSettings || []).map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
      <h2 class="title">${escapeHtml(c.welcomeCommandsTitle)}</h2>
      <div class="row wrap">${(c.welcomeCommands || []).slice(0,4).map(command => `<button class="button secondary small" data-action="send-command" data-prompt="${escapeHtml(command)}">${escapeHtml(command)}</button>`).join("")}</div>
    </section>
  </div>`;
}

function renderSessionSelect() {
  const c = copy();
  const sessions = state.sessions || [];
  if (!sessions.length) return renderWelcome();
  return `<div class="layout animate-in">
    <section class="panel stack">
      <div class="spread">
        <div class="stack" style="gap:3px">
          <h1 class="headline">${escapeHtml(c.selectTitle)}</h1>
          <p class="body">${escapeHtml(c.selectBody)}</p>
        </div>
        <span class="pill">${sessions.length}</span>
      </div>
      <div class="session-rail">
        ${sessions.map(renderSessionCard).join("")}
      </div>
    </section>
  </div>`;
}

function renderSessionCard(session) {
  const c = copy();
  const active = session.id === state.activeSessionId;
  const completed = (session.sectionHistory || []).filter(item => item.status === "completed" || item.status === "passed").length;
  const unfinished = state.currentSection?.sessionId === session.id;
  const deletePending = pendingDeleteSessionId === session.id;
  return `<article class="session-card ${active ? "active" : ""}">
    <div class="spread">

function buildDirectEvaluation(exercise, answer, claim = "") {
  const payload = exercise.payload || {};
  const skipped = answer === "[SKIPPED]";
  let correct = false;
  let userAnswer = answer;
  if (!skipped && ["language_info","listening","reading"].includes(exercise.type)) {
    correct = String(answer) === String(payload.correctChoiceId);
    const chosen = (payload.choices || []).find(choice => String(choice.id) === String(answer));
    userAnswer = chosen?.text || answer;
  } else if (!skipped && exercise.type === "writing") {
    correct = normalizeAnswer(answer) === normalizeAnswer(payload.targetSentence);
  }
  const score = skipped ? 0 : (correct ? 100 : 0);
  const short = skipped
    ? (uiLang() === "ko" ? "건너뛰었습니다." : "Skipped.")
    : (correct ? (uiLang() === "ko" ? "정답입니다." : "Correct.") : (uiLang() === "ko" ? "다시 확인해 보세요." : "Review this item."));
  return {
    exerciseId: exercise.id,
    score,
    skill: exercise.skill || exercise.type,
    userAnswer,
    learnerClaim: claim,
    skipped,
    needsReview: skipped || !correct,
    feedback: { short, detail: short },
  };
}
async function gradeDirectExercise(exercise, answer) {
  if (!exercise || !DIRECT_GRADE_TYPES.has(exercise.type)) return;
  const evaluation = buildDirectEvaluation(exercise, answer, typedAnswers.get(`${exercise.id}:claim`) || "");
  if (hasHost) {
    await callTool("grade_section_answers", {
      sessionId: getActiveSession()?.id,
      sectionId: getSection()?.id,
      evaluations: [evaluation],
      sectionFeedback: "Auto-graded objective exercise.",
    });
  } else {
    mockGradeAnswer(evaluation);
  }
}
function mockGradeAnswer(evaluation) {
  const section = getSection();
  if (!section) return;
  section.results ||= [];
  const index = section.results.findIndex(item => item.exerciseId === evaluation.exerciseId);
  if (index >= 0) section.results[index] = evaluation;
  else section.results.push(evaluation);
}
function pendingDirectEvaluationFor(exercise) {
  const answer = exercise.type === "writing"
    ? (typedAnswers.get(exercise.id) || tokenAnswer.map(item => item.text).join(" ") || "[SKIPPED]")
    : (typedAnswers.get(exercise.id) || "[SKIPPED]");
  return buildDirectEvaluation(exercise, answer, typedAnswers.get(`${exercise.id}:claim`) || "");
}
function summarizeObjectiveResults(exercises) {
  return exercises
    .filter(exercise => DIRECT_GRADE_TYPES.has(exercise.type))
    .map(exercise => {
      const result = getResultForExercise(exercise.id);
      if (!result) return `- ${exercise.id} (${exercise.type}): pending`;
      const status = result.skipped ? "skipped" : `score=${Math.round(Number(result.score) || 0)}`;
      return `- ${exercise.id} (${exercise.type}): ${status}; answer="${String(result.userAnswer || "").replaceAll('"', "'")}"`;
    })
    .join("\n");
}
async function savePendingDirectExercises() {
  const section = getSection();
  if (!section) return;
  const exercises = getAllExercises(section);
  const pending = exercises
    .filter(exercise => DIRECT_GRADE_TYPES.has(exercise.type) && !getResultForExercise(exercise.id))
    .map(pendingDirectEvaluationFor);
  if (!pending.length) return;
  if (hasHost) {
    await callTool("grade_section_answers", {
      sessionId: getActiveSession()?.id,
      sectionId: section.id,
      evaluations: pending,
      sectionFeedback: "Auto-graded pending objective exercises before final submission.",
    });
  } else {
    pending.forEach(mockGradeAnswer);
  }
}
async function submitSection() {
  const exercise = getCurrentExercise();
  if (exercise?.type === "writing" && tokenAnswer.length) {
    const answer = tokenAnswer.map(item => item.text).join(" ");
    typedAnswers.set(exercise.id, answer);
    await gradeDirectExercise(exercise, answer);
  }
  await savePendingDirectExercises();
  const section = getSection();
  if (!section) return;
  const exercises = getAllExercises(section);
  const speaking = exercises.filter(item => item.type === "speaking");
  const firstMissingSpeaking = speaking.find(item => !clean(typedAnswers.get(item.id)));
  if (firstMissingSpeaking) {
    const index = getExerciseIndexById(firstMissingSpeaking.id);
    if (index >= 0) currentExerciseIndex = index;
    notice = {
      title: t("speaking"),
      message: uiLang() === "ko" ? "말하기 답을 입력하거나 지금은 말할 수 없어요를 눌러 이 문제만 건너뛰어 주세요." : "Enter a speaking answer or skip only this speaking item.",
    };
    render();
    return;
  }
  if (!speaking.length) {
    if (hasHost) {
      await callTool("grade_section_answers", {
        sessionId: getActiveSession()?.id,
        sectionId: section.id,
        evaluations: [],
        sectionFeedback: "Objective exercises were already saved by the widget. Complete the practice set if every exercise has a result.",
      });
    } else {
      state.currentSection = null;
      viewMode = state.sessions?.length ? "select" : "welcome";
      toast = t("sectionComplete");
    }
    requestInlineDisplayMode("section-complete");
    return;
  }
  const lines = speaking.map(item => {
    const answer = typedAnswers.get(item.id) || "[SKIPPED]";
    const claim = typedAnswers.get(`${item.id}:claim`) || "";
    return `- ${item.id} (${item.type}): "${answer}"${claim ? ` (Learner Claim: ${claim})` : ""}`;
  });
  const msg = [
    "[LingoStar Speaking Submit]",
    `Section: ${section.id}`,
    "Speaking Answers:",
    lines.join("\n"),
    "Objective Results Already Saved:",
    summarizeObjectiveResults(exercises) || "(none)",
    "Instruction: Evaluate ONLY the speaking answers and call grade_section_answers for speaking exercise IDs only. Do not infer objective items were skipped; their saved results are listed above. For [SKIPPED], set skipped=true and needsReview=true.",
  ].join("\n");
  sendFollowUpToHost(msg, {
    visiblePrompt: t("sectionSubmitPrompt"),
    modelContext: msg,
    structuredContent: {
      lingostar: {
        command: "grade_section_answers",
        sessionId: getActiveSession()?.id,
        sectionId: section.id,
        objectiveResults: exercises.filter(item => DIRECT_GRADE_TYPES.has(item.type)).map(item => getResultForExercise(item.id)).filter(Boolean),
        answers: speaking.map(item => ({
          exerciseId: item.id,
          type: item.type,
          userAnswer: typedAnswers.get(item.id) || "[SKIPPED]",
          learnerClaim: typedAnswers.get(`${item.id}:claim`) || null,
        })),
      },
    },
  });
}

let currentUtterance = null;
function playListeningAudio(exercise) {
  if (!exercise) return;
  const text = exercise.payload?.audioText || "";
  if (!("speechSynthesis" in window) || !window.speechSynthesis) {
    showAudioNotice("listen");
    return;
  }
  stopAudio();
  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.lang = exercise.payload?.speechLang || getActiveSession()?.runtime?.speechLang || "en-US";
  currentUtterance.rate = clamp(getActiveSession()?.settings?.ttsRate, .6, 1.4, 1);
  window.speechSynthesis.speak(currentUtterance);
}
function stopAudio() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  currentUtterance = null;
}
let recognition = null;
function startSpeechRecognition(exercise) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    showAudioNotice("speech");
    return;
  }
  recognition = new Recognition();
  recognition.lang = exercise?.payload?.speechLang || getActiveSession()?.runtime?.speechLang || "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = event => {
    const transcript = event.results?.[0]?.[0]?.transcript || "";
    if (exercise && transcript) typedAnswers.set(exercise.id, transcript);
    render();
  };
  recognition.onerror = () => showAudioNotice("speech");
  recognition.start();
}
function stopSpeechRecognition() {
  try { recognition?.stop(); } catch {}
  recognition = null;
}
let mediaRecorder = null;
let audioChunks = [];
async function startRecording() {
  if (!navigator.mediaDevices?.getUserMedia) {
    showAudioNotice("speech");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = event => { if (event.data?.size) audioChunks.push(event.data); };
    mediaRecorder.start();
    toast = uiLang() === "ko" ? "녹음 중입니다." : "Recording.";
    render();
  } catch {
    showAudioNotice("speech");
  }
}
async function stopRecordingAndTranscribe(exercise) {
  if (!mediaRecorder) return;
  const recorder = mediaRecorder;
  mediaRecorder = null;
  const done = new Promise(resolve => { recorder.onstop = resolve; });
  recorder.stop();
  recorder.stream.getTracks().forEach(track => track.stop());
  await done;
  const blob = new Blob(audioChunks, { type: "audio/webm" });
  const base64 = await blobToBase64(blob);
  const response = await callTool("transcribe_audio", {
    audioBase64: base64,
    mimeType: blob.type,
    speechLang: exercise?.payload?.speechLang || getActiveSession()?.runtime?.speechLang,
  });
  const transcript = response?.structuredContent?.transcript || response?.result?.structuredContent?.transcript || "";
  if (exercise && transcript) typedAnswers.set(exercise.id, transcript);
  render();
}
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || "").split(",")[1] || "");
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

appEl.addEventListener("click", async event => {
  const btn = event.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "open-help") { openHelpPage(); return; }
  if (action === "close-notice") { notice = null; render(); return; }
  if (action === "open-feedback") { feedbackOpen = true; render(); return; }
  if (action === "close-feedback") { feedbackOpen = false; render(); return; }
  if (action === "send-command") { sendFollowUpToHost(btn.dataset.prompt || ""); return; }
  if (action === "select-session") {
    const sessionId = btn.dataset.sessionId;
    state.activeSessionId = sessionId;
    await callTool("select_learning_session", { sessionId });
    sendFollowUpToHost(t("sessionSelectedPrompt"), {
      modelContext: `LingoStar selected session ${sessionId}. If no current section exists, create the next practice set.`,
      structuredContent: { lingostar: { command: "select_session", sessionId } },
    });
    return;
  }
  if (action === "delete-session") {
    pendingDeleteSessionId = btn.dataset.sessionId || null;
    render();
    return;
  }
  if (action === "cancel-delete-session") {
    pendingDeleteSessionId = null;
    render();
    return;
  }
  if (action === "confirm-delete-session") {
    const sessionId = btn.dataset.sessionId;
    pendingDeleteSessionId = null;
    await callTool("delete_session", { sessionId });
    sendFollowUpToHost(t("sessionDeletedPrompt"), {
      modelContext: `LingoStar deleted session ${sessionId}. Show remaining learning tracks from latest state.`,
      structuredContent: { lingostar: { command: "delete_session", sessionId } },
    });
    return;
  }
  if (action === "select-choice") {
    const exercise = getCurrentExercise();
    const exerciseId = btn.dataset.exerciseId;
    typedAnswers.set(exerciseId, btn.dataset.choiceId);
    if (exercise?.id === exerciseId && DIRECT_GRADE_TYPES.has(exercise.type)) await gradeDirectExercise(exercise, btn.dataset.choiceId);
    render();
    return;
  }
  if (action === "add-token") {
    const index = Number(btn.dataset.tokenIndex);
    const text = btn.dataset.tokenText;
    if (!tokenAnswer.some(item => item.index === index)) tokenAnswer.push({ index, text });
    render();
    return;
  }
  if (action === "remove-token") {
    tokenAnswer.splice(Number(btn.dataset.tokenAnswerIndex), 1);
    render();
    return;
  }
  if (action === "reset-writing") { tokenAnswer = []; typedAnswers.delete(getCurrentExercise()?.id); render(); return; }
  if (action === "prev-exercise") {
    if (currentExerciseIndex > 0) currentExerciseIndex -= 1;
    tokenAnswer = [];
    render();
    return;
  }
  if (action === "next-exercise") {
    const exercise = getCurrentExercise();
    if (exercise?.type === "writing" && tokenAnswer.length) {
      const answer = tokenAnswer.map(item => item.text).join(" ");
      typedAnswers.set(exercise.id, answer);
      await gradeDirectExercise(exercise, answer);
    }
    if (currentExerciseIndex < getAllExercises().length - 1) currentExerciseIndex += 1;
    tokenAnswer = [];
    render();
    return;
  }
  if (action === "skip-exercise") {
    const exercise = getCurrentExercise();
    if (!exercise) return;
    typedAnswers.set(exercise.id, "[SKIPPED]");
    if (DIRECT_GRADE_TYPES.has(exercise.type)) await gradeDirectExercise(exercise, "[SKIPPED]");
    if (currentExerciseIndex < getAllExercises().length - 1) currentExerciseIndex += 1;
    tokenAnswer = [];
    render();
    return;
  }
  if (action === "submit-section") { await submitSection(); return; }
  if (action === "play-audio") { playListeningAudio(getCurrentExercise()); return; }
  if (action === "stop-audio") { stopAudio(); return; }
  if (action === "start-speaking") { startSpeechRecognition(getCurrentExercise()); return; }
  if (action === "stop-speaking") { stopSpeechRecognition(); return; }
  if (action === "start-recording") { await startRecording(); return; }
  if (action === "stop-recording") { await stopRecordingAndTranscribe(getCurrentExercise()); return; }
});

async function runPreviewTool(name, args) {
  await new Promise(resolve => setTimeout(resolve, 120));
  if (name === "select_learning_session") {
    state.activeSessionId = args.sessionId;
    return { structuredContent: { state, initialView: state.currentSection ? "lesson" : "select" } };
  }
  if (name === "delete_session") {
    state.sessions = state.sessions.filter(session => session.id !== args.sessionId);
    if (state.activeSessionId === args.sessionId) state.activeSessionId = state.sessions[0]?.id || null;
    return { structuredContent: { state, initialView: state.sessions.length ? "select" : "welcome" } };
  }
  if (name === "grade_section_answers") {
    const section = getSection();
    if (section) {
      section.results ||= [];
      for (const evaluation of args.evaluations || []) mockGradeAnswer(evaluation);
      const ids = new Set(section.results.map(result => result.exerciseId));
      if ((section.exercises || []).every(exercise => ids.has(exercise.id))) {
        state.currentSection = null;
      }
    }
    return { structuredContent: { state, initialView: state.currentSection ? "lesson" : "select" }, content: [{ type: "text", text: "Saved." }] };
  }
  if (name === "transcribe_audio") return { structuredContent: { state, transcript: "Preview transcript" } };
  if (name === "submit_feedback") return { structuredContent: { state }, content: [{ type: "text", text: "Feedback saved." }] };
  return { structuredContent: { state } };
}
function seedPreviewIfNeeded() {
  if (hasHost || state.sessions.length) return;
  state.sessions = [{
    id: "preview-japanese",
    targetLanguage: "Japanese",
    nativeLanguage: "Korean",
    goal: { type: "exam", detail: "JLPT N4" },
    status: "active",
    settings: { speakingEnabled: false, exerciseCounts: { language_info: 3, listening: 3, reading: 3, writing: 3, speaking: 3 }, ttsRate: 1, displayLanguage: "auto" },
    runtime: { interfaceLanguage: "ko", speechLang: "ja-JP" },
    skillProfile: { language_info: 20, listening: 20, reading: 20, writing: 20, speaking: 0 },
    sectionHistory: [],
  }];
  state.activeSessionId = "preview-japanese";
}
seedPreviewIfNeeded();
hydrateFromOpenAiGlobals();
applyInitialView(DEFAULT_VIEW && !DEFAULT_VIEW.startsWith("__") ? DEFAULT_VIEW : "auto");
render();
</script>
