substitutions:
  _REGION: asia-northeast3
  _SERVICE: lingostar
  _APP_ORIGIN: https://lingostar-859181361542.asia-northeast3.run.app
  _CORS_ALLOWED_ORIGINS: https://lingostar-859181361542.asia-northeast3.run.app,https://chatgpt.com
  _WIDGET_CONNECT_DOMAINS: https://lingostar-859181361542.asia-northeast3.run.app
  _WIDGET_RESOURCE_DOMAINS: https://lingostar-859181361542.asia-northeast3.run.app
  _OPENAI_SECRET: openai-api-key:latest
  _IS_AI_FALLBACK: "false"
  _STATE_STORE: firestore
  _FIRESTORE_PROJECT_ID: "lingostar-499311"
  _FIRESTORE_DATABASE_ID: "(default)"
  _FIRESTORE_COLLECTION: lingostar_states
  _AUTH_REQUIRED: "1"
  _OAUTH_ISSUER: "dev-xeh0uw73dwpc4hpk.us.auth0.com"
  _OAUTH_AUTHORIZATION_SERVERS: "dev-xeh0uw73dwpc4hpk.us.auth0.com"
  _OAUTH_JWKS_URL: "dev-xeh0uw73dwpc4hpk.us.auth0.com/.well-known/jwks.json"
  _OAUTH_AUDIENCE: https://lingostar-859181361542.asia-northeast3.run.app
  _OAUTH_SCOPES: lingostar.read lingostar.write lingostar.audio
  _OAUTH_REQUEST_SCOPES: lingostar.read lingostar.write lingostar.audio
  _OAUTH_CLIENT_ID: "tpc_jtLrg8FH4NUqaz1aC5SfPd"
  _OAUTH_SCOPE_MODE: "none"
  _OAUTH_VALIDATE_CLIENT_ID: "true"
  _OAUTH_ALLOW_SCOPELESS_TOKENS: "false"
  _FEEDBACK_ID_SECRET: feedback-id:latest
  _FEEDBACK_PW_SECRET: feedback-pw:latest

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - gcloud artifacts repositories describe cloud-run-source-deploy --location=${_REGION} || gcloud artifacts repositories create cloud-run-source-deploy --repository-format=docker --location=${_REGION}
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --allow-unauthenticated
      - --port
      - "8080"
      - --no-use-http2
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --set-env-vars
      - OAUTH_CLIENT_ID=${_OAUTH_CLIENT_ID}
      - --set-env-vars
      - OAUTH_SCOPE_MODE=${_OAUTH_SCOPE_MODE}
      - --set-env-vars
      - OAUTH_VALIDATE_CLIENT_ID=${_OAUTH_VALIDATE_CLIENT_ID}
      - --set-env-vars
      - OAUTH_ALLOW_SCOPELESS_TOKENS=${_OAUTH_ALLOW_SCOPELESS_TOKENS}
      - --set-env-vars
      - APP_ORIGIN=${_APP_ORIGIN}
      - --set-env-vars
      - ^@^CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}
      - --set-env-vars
      - WIDGET_CONNECT_DOMAINS=${_WIDGET_CONNECT_DOMAINS}
      - --set-env-vars
      - WIDGET_RESOURCE_DOMAINS=${_WIDGET_RESOURCE_DOMAINS}
      - --set-env-vars
      - IS_AI_FALLBACK=${_IS_AI_FALLBACK}
      - --set-env-vars
      - LINGOSTAR_STATE_STORE=${_STATE_STORE}
      - --set-env-vars
      - FIRESTORE_PROJECT_ID=${_FIRESTORE_PROJECT_ID}
      - --set-env-vars
      - FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}
      - --set-env-vars
      - FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION}
      - --set-env-vars
      - LINGOSTAR_AUTH_REQUIRED=${_AUTH_REQUIRED}
      - --set-env-vars
      - OAUTH_ISSUER=https://${_OAUTH_ISSUER}
      - --set-env-vars
      - OAUTH_AUTHORIZATION_SERVERS=https://${_OAUTH_AUTHORIZATION_SERVERS}
      - --set-env-vars
      - OAUTH_JWKS_URL=https://${_OAUTH_JWKS_URL}
      - --set-env-vars
      - OAUTH_AUDIENCE=${_OAUTH_AUDIENCE}
      - --set-env-vars
      - OAUTH_SCOPES=${_OAUTH_SCOPES}
      - --set-env-vars
      - OAUTH_REQUEST_SCOPES=${_OAUTH_REQUEST_SCOPES}
      - --set-env-vars
      - OAUTH_RESOURCE_DOCUMENTATION=${_APP_ORIGIN}/privacy-poilcy.html
      - --set-secrets
      - OPENAI_API_KEY=${_OPENAI_SECRET},FEEDBACK_ADMIN_ID=${_FEEDBACK_ID_SECRET},FEEDBACK_ADMIN_PASSWORD=${_FEEDBACK_PW_SECRET}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
