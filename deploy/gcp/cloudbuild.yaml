substitutions:
  _REGION: asia-northeast3
  _SERVICE: lingostar
  _APP_ORIGIN: https://your-lingostar-service.example.com
  _CORS_ALLOWED_ORIGINS: https://your-lingostar-service.example.com,https://chatgpt.com
  _WIDGET_CONNECT_DOMAINS: https://your-lingostar-service.example.com
  _WIDGET_RESOURCE_DOMAINS: https://your-lingostar-service.example.com
  _OPENAI_SECRET: openai-api-key:latest
  _IS_AI_FALLBACK: "false"
  _STATE_STORE: firestore
  _FIRESTORE_PROJECT_ID: ""
  _FIRESTORE_DATABASE_ID: "(default)"
  _FIRESTORE_COLLECTION: lingostar_states
  _AUTH_REQUIRED: "1"
  _OAUTH_ISSUER: ""
  _OAUTH_AUTHORIZATION_SERVERS: ""
  _OAUTH_JWKS_URL: ""
  _OAUTH_AUDIENCE: https://your-lingostar-service.example.com
  _OAUTH_SCOPES: lingostar.read lingostar.write lingostar.audio

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - gcloud artifacts repositories describe cloud-run-source-deploy --location=${_REGION} || gcloud artifacts repositories create cloud-run-source-deploy --repository-format=docker --location=${_REGION}
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --set-env-vars
      - APP_ORIGIN=${_APP_ORIGIN},CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS},WIDGET_CONNECT_DOMAINS=${_WIDGET_CONNECT_DOMAINS},WIDGET_RESOURCE_DOMAINS=${_WIDGET_RESOURCE_DOMAINS},IS_AI_FALLBACK=${_IS_AI_FALLBACK},LINGOSTAR_STATE_STORE=${_STATE_STORE},FIRESTORE_PROJECT_ID=${_FIRESTORE_PROJECT_ID},FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION},LINGOSTAR_AUTH_REQUIRED=${_AUTH_REQUIRED},OAUTH_ISSUER=${_OAUTH_ISSUER},OAUTH_AUTHORIZATION_SERVERS=${_OAUTH_AUTHORIZATION_SERVERS},OAUTH_JWKS_URL=${_OAUTH_JWKS_URL},OAUTH_AUDIENCE=${_OAUTH_AUDIENCE},OAUTH_SCOPES=${_OAUTH_SCOPES},OAUTH_RESOURCE_DOCUMENTATION=${_APP_ORIGIN}/privacy-poilcy.html
      - --set-secrets
      - OPENAI_API_KEY=${_OPENAI_SECRET}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$SHORT_SHA
